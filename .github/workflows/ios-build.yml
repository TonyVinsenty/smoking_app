name: iOS build

# Manual run only: started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A pinned macOS version, not "latest": the image (and its Xcode)
    # must not change under us silently.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install Flutter
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      # Firebase settings are not in the public repo: rebuilt from a repository secret.
      - name: Firebase settings
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "::error::Secret FIREBASE_OPTIONS_DART is missing (base64 of lib/firebase_options.dart)"
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart

      - name: Get dependencies
        run: flutter pub get

      # The home-screen widget is a separate extension target; it is added to the
      # Xcode project here because there is no Xcode on the developer's machine.
      - name: Add home-screen widget
        run: |
          set -euo pipefail
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install --user-install --no-document xcodeproj
          ruby ios/scripts/add_widget_target.rb

      # No signing here: Sideloadly signs the .ipa later on the user's computer
      # with a free Apple ID, so no certificates are stored in CI.
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      # An ad hoc signature carries the App Group entitlement (shared by the app
      # and the widget) into the .ipa, so Sideloadly knows to request it.
      - name: Embed entitlements (ad hoc)
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP/PlugIns/ZeroWidget.appex" ]; then
            echo "::error::The widget extension is missing from Runner.app/PlugIns"
            exit 1
          fi
          for f in "$APP"/Frameworks/*; do codesign -f -s - "$f"; done
          codesign -f -s - --entitlements ios/ZeroWidget/ZeroWidget.entitlements "$APP/PlugIns/ZeroWidget.appex"
          codesign -f -s - --entitlements ios/Runner/Runner.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          codesign -d --entitlements - "$APP/PlugIns/ZeroWidget.appex"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/PlugIns/ZeroWidget.appex/Info.plist"

      - name: Check bundle id and read version
        run: |
          set -euo pipefail
          PLIST="build/ios/iphoneos/Runner.app/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          if [ "$BUNDLE_ID" != "com.tonyvinsenty.smokingApp" ]; then
            echo "::error::Unexpected bundle id '$BUNDLE_ID', expected com.tonyvinsenty.smokingApp"
            exit 1
          fi
          if [ "$DISPLAY_NAME" != "Zero" ]; then
            echo "::error::Unexpected display name '$DISPLAY_NAME', expected Zero"
            exit 1
          fi
          echo "Bundle id check passed: $BUNDLE_ID ($DISPLAY_NAME)"
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons:AppIcon-7a" "$PLIST" >/dev/null 2>&1; then
            echo "::error::Alternate app icons are missing from Info.plist"
            exit 1
          fi
          echo "Alternate app icons: present"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "Version $VERSION (build $BUILD)"
          echo "IPA_NAME=Zero-$VERSION-$BUILD.ipa" >> "$GITHUB_ENV"

      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$IPA_NAME" Payload

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.IPA_NAME }}
          archive: false
          retention-days: 14
          if-no-files-found: error
